        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Indexer_GetOrderbookOrders_Request'
            example:
              page:
                page: 1
                pageSize: 100
              orderbookContractAddress: '0xfdb42A198a932C8D3B506Ffa5e855bC4b348a712'
              collectionAddress: '0x602d5dc17490794267c7fa5f58a453eb9159a86d'
