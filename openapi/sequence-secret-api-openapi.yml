                isListing: null
                userAddresses: null
                tokenIds: null
                excludeUserAddresses: null
                afterBlockNumber: 0
                afterCreatedAt: 0
                beforeExpiry: 0
                userAddress: null
                excludeUserAddress: null
              orderStatuses:
              - OPEN
              filters: null
              beforeExpiryTimestamp: 0
              blockNumberAfter: 0
              createdAtAfter: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indexer_GetOrderbookOrders_Response'
              example:
                page:
                  page: 2
                  pageSize: 100
                  more: false
                orders:
                - orderId: '1198'
                  tokenContract: '0x602d5dc17490794267c7fa5f58a453eb9159a86d'
                  tokenId: '3'
                  isListing: true
                  quantity: '1'
                  quantityRemaining: '1'
