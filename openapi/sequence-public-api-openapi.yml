components:
  schemas:
    Filter:
      type: object
      properties:
        text:
          type: string
        properties:
          type: array
          description: '[]PropertyFilter'
          items:
            $ref: '#/components/schemas/PropertyFilter'
    PropertyFilter:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/PropertyType'
        min:
          type: number
        max:
          type: number
        values:
          type: array
          description: '[]any'
          items:
            type: object
    ErrorInvalidArgument:
      type: object
      required:
      - error
      - code
      - msg
      - status
      properties:
        error:
          type: string
          example: InvalidArgument
        code:
          type: number
          example: 2001
        msg:
          type: string
          example: Invalid argument
        cause:
          type: string
        status:
          type: number
          example: 400
    Metadata_GetTokenMetadata_Request:
      type: object
      properties:
        chainID:
          type: string
        contractAddress:
          type: string
        tokenIDs:
          type: array
          description: '[]string'
          items:
            type: string
    Metadata_DirectoryGetNetworks_Response:
      type: object
      properties:
        networks:
          type: array
          description: '[]uint64'
          items:
            type: number
    ErrorUnauthorized:
      type: object
      required:
      - error
      - code
      - msg
      - status
      properties:
        error:
          type: string
          example: Unauthorized
        code:
          type: number
          example: 1000
        msg:
          type: string
          example: Unauthorized access
        cause:
          type: string
        status:
          type: number
          example: 401
    Indexer_SubscribeReceipts_Response:
      type: object
      properties:
        receipt:
          $ref: '#/components/schemas/TransactionReceipt'
    Metadata_SearchContractInfo_Response:
      type: object
      properties:
        contractInfoList:
          type: array
          description: '[]ContractInfo'
          items:
            $ref: '#/components/schemas/ContractInfo_2'
    ErrorPermissionDenied:
      type: object
      required:
      - error
      - code
      - msg
      - status
      properties:
        error:
          type: string
          example: PermissionDenied
        code:
          type: number
          example: 1001
        msg:
          type: string
          example: Permission denied
        cause:
          type: string
        status:
          type: number
          example: 403
    Metadata_DirectoryGetCollections_Response:
      type: object
      properties:
        collections:
          type: array
          description: '[]ContractInfo'
          items:
            $ref: '#/components/schemas/ContractInfo_2'
        page:
          $ref: '#/components/schemas/Page_2'
    Indexer_GetTransactionHistory_Response:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Page'
        transactions:
          type: array
          description: '[]Transaction'
          items:
            $ref: '#/components/schemas/Transaction'
    ContractType:
      type: string
      description: Represented as uint8 on the server side
      enum:
      - UNKNOWN
      - NATIVE
      - ERC20
      - ERC721
      - ERC1155
      - SEQUENCE_WALLET
      - ERC20_BRIDGE
      - ERC721_BRIDGE
      - ERC1155_BRIDGE
      - SEQ_MARKETPLACE
    ErrorUnavailable:
      type: object
      required:
      - error
      - code
      - msg
      - status
      properties:
        error:
          type: string
          example: Unavailable
        code:
          type: number
