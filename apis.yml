aid: sequence
name: Sequence
description: >-
  Sequence is a web3 developer platform (0xsequence, now part of Polygon Labs) for
  building blockchain applications: smart-contract wallets, a universal crypto payments
  and swap layer, a real-time multi-chain Indexer with balances, token prices, contract
  events and webhooks, plus Metadata, Marketplace, Transactions (Relayer) and Analytics
  APIs. Its backend APIs are webrpc-generated (POST /rpc/{Service}/{Method}) authenticated
  with a project access key and secret JWT, and it ships first-party SDKs for TypeScript,
  Go, Unity, Unreal, Kotlin and Swift plus a CLI. Backed by a16z and Polychain.
